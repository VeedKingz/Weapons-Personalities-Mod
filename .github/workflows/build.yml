name: Build Weapon Personalities Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build mod JAR
        run: gradle build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G -Dfile.encoding=UTF-8"

      - name: Find built JAR
        run: find build/libs -name "*.jar" | grep -v sources

      - name: Rename JAR
        run: |
          mkdir -p output
          JAR=$(find build/libs -name "*.jar" | grep -v sources | head -1)
          cp "$JAR" "output/Weapon Personalities.jar"
          echo "Copied: $JAR"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Weapon-Personalities-Mod
          path: "output/Weapon Personalities.jar"
          retention-days: 90
