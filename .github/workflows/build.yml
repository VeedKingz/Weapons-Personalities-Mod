name: Build Weapon Personalities Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cache Gradle and ForgeGradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build mod JAR
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle build --no-daemon --stacktrace -x test
        env:
          GRADLE_OPTS: "-Xmx4G -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      - name: Show built JARs
        run: ls -lh build/libs/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Weapon-Personalities-Mod
          path: build/libs/WeaponPersonalities-*.jar
          if-no-files-found: error
          retention-days: 90
