name: Build Weapon Personalities Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Cache Gradle and Minecraft files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/minecraft
          key: ${{ runner.os }}-rfg-1.12.2-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-rfg-1.12.2-

      - name: Build mod JAR
        run: gradle build --no-daemon --stacktrace -x test
        env:
          GRADLE_OPTS: "-Xmx4G -Dfile.encoding=UTF-8"

      - name: List output JARs
        run: find build/libs -name "*.jar" ! -name "*sources*"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Weapon-Personalities-Mod
          path: build/libs/*[!sources].jar
          retention-days: 90
