name: Build Weapon Personalities Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger a build manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 8 (required by Forge 1.12.2)
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. Install Gradle 4.10.3 (matches gradle-wrapper.properties)
      - name: Install Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-4.10.3/bin" >> $GITHUB_PATH

      # 4. Cache the Gradle home directory
      #    This saves the Forge workspace download so repeat builds are fast
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Set up the Forge development workspace
      #    This step downloads Minecraft + Forge + MCP mappings (~500 MB).
      #    It only runs in full on the very first build; the cache above
      #    makes every subsequent build much faster.
      - name: Setup Forge workspace
        run: gradle setupDecompWorkspace --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"

      # 6. Compile and package the mod JAR
      - name: Build mod JAR
        run: gradle build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"

      # 7. Rename the JAR to a friendly name
      - name: Rename JAR
        run: |
          mkdir -p output
          cp build/libs/weaponpersonalities-*.jar "output/Weapon Personalities.jar"

      # 8. Upload the JAR as a downloadable artifact
      #    Go to: Actions tab → your build run → scroll down to "Artifacts"
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Weapon-Personalities-Mod
          path: "output/Weapon Personalities.jar"
          retention-days: 90
